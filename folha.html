<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folha de modelos</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800;900&family=Alegreya:ital,wght@0,500;0,600;0,700;1,600&family=Cinzel:wght@700;900&display=swap">
  <style>html,body{margin:0;height:100%;background:#9A9AA0;overflow:hidden}canvas{width:100vw;height:100vh;display:block}</style>
</head>
<body>
  <!-- Folha de modelos para conferir o desenho dos personagens (só para desenvolvimento): npm run dev e abra /folha.html -->
  <canvas id="c" width="1600" height="1000"></canvas>
  <script type="module">
    import { drawPerson, drawEnemy, drawBoss } from './src/game/draw.js';
    import { ENEMIES, BOSSES } from './src/data/bestiary.js';
    const modo = new URLSearchParams(location.search).get('m') || 'herois';
    const g = document.getElementById('c').getContext('2d');
    const looks = [
      { skin: '#C68B59', hair: '#3A2314', tunic: '#3B4CCA', cape: '#F2C14E', style: 'curto' },
      { skin: '#E3B48C', hair: '#D9D2C5', tunic: '#3E3656', cape: '#C0392B', style: 'turbante', beard: true },
      { skin: '#D9A273', hair: '#3A2314', tunic: '#8E44AD', cape: 'none', style: 'veu' },
      { skin: '#F2D0B0', hair: '#F2C14E', tunic: '#FFFFFF', cape: '#F2C14E', style: 'longo', anjo: true },
      { skin: '#8A5A3A', hair: '#1C120A', tunic: '#2E8B57', cape: '#ECE3CF', style: 'black' },
      { skin: '#C68B59', hair: '#6A5A4A', tunic: '#B9875A', cape: 'none', style: 'careca', beard: true },
      { skin: '#E3B48C', hair: '#8A2A1A', tunic: '#C0392B', cape: '#3A2314', style: 'franja' },
      { skin: '#C68B59', hair: '#2B1A10', tunic: '#1F8A9E', cape: '#F2C14E', style: 'espetado' },
      { skin: '#F2D0B0', hair: '#B8863B', tunic: '#ECE3CF', cape: '#8E1B2E', style: 'trancas' },
      { skin: '#D9A273', hair: '#3A2314', tunic: '#7A5232', cape: 'none', style: 'coque' }
    ];
    function frame(ms) {
      const T = ms / 1000;
      g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#9A9AA0'; g.fillRect(0, 0, 1600, 1000);
      if (modo === 'herois') {
        looks.slice(0, 5).forEach((L, i) => drawPerson(g, 170 + i * 310, 400, 8, L, { t: T + i, fx: 0.1, fy: 1, walk: T }));
        looks.slice(5).forEach((L, i) => drawPerson(g, 170 + i * 310, 860, 8, L, { t: T + i, fx: i === 2 ? 0.9 : 0.1, fy: i === 2 ? 0.3 : 1, walk: T, moving: i === 2 }));
      } else if (modo === 'jogo') {
        // tamanho de verdade no jogo (câmera ~1.6x), andando
        looks.forEach((L, i) => drawPerson(g, 120 + i * 140, 500, 1.6 * 2, L, { t: T + i, fx: Math.cos(T + i), fy: Math.sin(T + i), walk: T, moving: true }));
      } else {
        Object.keys(ENEMIES).forEach((k, i) => { const d = ENEMIES[k]; g.save(); g.translate(90 + i * 150, 300); g.scale(2.6, 2.6); drawEnemy(g, { x: 0, y: 0, r: d.r, ph: i, type: k, flash: 0, telegraph: 0 }, d, T, 0, 40); g.restore(); });
        ['mamom', 'procrastinacao', 'mentira', 'imoralidade', 'satanas', 'behemote', 'leviata', 'golias'].forEach((k, i) => { g.save(); g.translate(110 + i * 190, 750); g.scale(1.4, 1.4); drawBoss(g, { x: 0, y: 0, r: 40, id: k, d: BOSSES[k], flash: 0, hp: 1, max: 1 }, T); g.restore(); });
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
